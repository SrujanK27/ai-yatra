[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Map API requests to Netlify Serverless Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single Page Application (SPA) client routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
